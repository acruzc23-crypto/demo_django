<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f5fa; margin: 0; color: #1f2a44; }
        header { background: #0b3d91; color: #fff; padding: 28px 40px; }
        header h1 { margin: 0; font-size: 28px; }
        header p { margin: 6px 0 0; opacity: .85; }
        main { max-width: 760px; margin: 32px auto; padding: 0 20px; }
        .mensaje { background: #fff; border-left: 6px solid #f28c28; padding: 20px 24px;
                   font-size: 22px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
        h2 { margin-top: 32px; font-size: 18px; }
        ol { background: #fff; padding: 18px 40px; border-radius: 6px; line-height: 1.9; }
        footer { text-align: center; font-size: 13px; color: #6b7590; margin: 30px 0; }
    </style>
</head>
<body>
    <header>
        <h1>{{ titulo }}</h1>
        <p>Universidad Estatal de Milagro (UNEMI) · Django - patrón MVT</p>
    </header>
    <main>
        <div class="mensaje">{{ mensaje }}</div>

        <h2>Recorrido de la petición</h2>
        <ol>
            {% for paso in flujo %}
                <li>{{ paso }}</li>
            {% endfor %}
        </ol>
    </main>
    <footer>Página renderizada por Django con render() y una plantilla.</footer>
</body>
</html>
